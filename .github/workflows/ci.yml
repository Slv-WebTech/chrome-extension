name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build and validate the extension
        run: pnpm build

      - name: Package
        run: node scripts/package-extension.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-dashboard-extension
          path: release/*.zip
          if-no-files-found: error

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (loads the unpacked extension)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
